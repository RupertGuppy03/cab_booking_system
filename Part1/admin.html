<!--
  Student: Rupert Guppy | ID: 23196925
  File: admin.html
  Description: Admin panel for CabsOnline. Allows staff to search bookings by reference
               number or view all unassigned bookings due within 2 hours. Displays results
               in a table and allows staff to assign a taxi to a booking via an Assign button.

  Functions (defined in admin.js):
    - searchBookings():  Validates the BRN format if input is non-empty, then sends a
                         fetch request to admin.php to retrieve matching or unassigned bookings.
                         Renders the results in a table inside the .content div.
    - assignBooking():   Sends the BRN of a selected booking to admin.php via fetch to update
                         its status from unassigned to assigned. Displays a confirmation message
                         and disables the corresponding Assign button.
    - validateBrn():     Checks whether a given string matches the BRN format (BRN + 5 digits).
                         Returns true if valid, false otherwise.
    - renderTable():     Takes the booking records returned from admin.php and builds the
                         results table inside the .content div.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CabsOnline – Admin Panel</title>
  <style>
    /* ── Reset ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Page base ── */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      padding: 30px 20px;
    }

    /* ── Top header bar ── */
    header {
      background-color: #1a1a2e;
      color: white;
      padding: 20px 30px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 1.8rem;
    }

    header p {
      font-size: 0.95rem;
      color: #ccc;
      margin-top: 4px;
    }

    /* ── White card that wraps the search bar ── */
    .search-container {
      background: white;
      padding: 24px;
      border-radius: 8px;
      max-width: 700px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .search-container h2 {
      font-size: 1.1rem;
      color: #1a1a2e;
      margin-bottom: 16px;
    }

    /* ── Search input and button row ── */
    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-row input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.95rem;
    }

    .search-row input[type="text"]:focus {
      outline: none;
      border-color: #1a1a2e;
    }

    /* ── Search button ── */
    input[type="button"] {
      padding: 10px 20px;
      background-color: #1a1a2e;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    input[type="button"]:hover {
      background-color: #16213e;
    }

    /* ── Error message shown for invalid BRN format ── */
    .error-msg {
      color: #c0392b;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    /* ── Hint text below search bar ── */
    .search-hint {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
    }

    /* ── Results table container (required class name for marking) ── */
    .content {
      background: white;
      border-radius: 8px;
      padding: 24px;
      max-width: 1100px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ── Results table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead {
      background-color: #1a1a2e;
      color: white;
    }

    thead th {
      padding: 12px 10px;
      text-align: left;
      font-weight: normal;
    }

    tbody tr {
      border-bottom: 1px solid #eee;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody td {
      padding: 10px;
      vertical-align: middle;
    }

    /* ── Assign button inside each table row ── */
    .assign-btn {
      padding: 6px 14px;
      background-color: #1a1a2e;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .assign-btn:hover {
      background-color: #16213e;
    }

    /* ── Greyed out state after assignment ── */
    .assign-btn:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    /* ── Confirmation message shown after assignment ── */
    .assign-confirmation {
      margin-top: 20px;
      padding: 14px 18px;
      background-color: #eafaf1;
      border: 1px solid #2ecc71;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #1a1a2e;
      display: none;
    }

    /* ── Message shown when no results found ── */
    .no-results {
      font-size: 0.9rem;
      color: #888;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <!-- Page header -->
  <header>
    <h1>CabsOnline</h1>
    <p>Admin Panel — Manage and assign taxi bookings</p>
  </header>

  <!-- Search section -->
  <div class="search-container">
    <h2>Search Bookings</h2>

    <div class="search-row">
      <!-- Search input: name="bsearch" required by marking scheme -->
      <input type="text" name="bsearch" id="bsearch" placeholder="Enter booking reference e.g. BRN00001" />

      <!-- Search button: name="sbutton" required by marking scheme -->
      <input type="button" name="sbutton" id="sbutton" value="Search" onclick="searchBookings()" />
    </div>

    <!-- Error shown when BRN format is invalid -->
    <span class="error-msg" id="err-brn">Invalid format. Booking reference must be in the format BRN00001.</span>

    <p class="search-hint">Leave blank to view all unassigned bookings due within the next 2 hours.</p>
  </div>

  <!--
    Results container: class="content" required by marking scheme.
    Table is injected here by renderTable() in admin.js.
    Confirmation message after assignment is also inserted here.
  -->
  <div class="content" id="contentDiv">
    <p class="no-results">Use the search above to find bookings.</p>
  </div>

  <!-- admin.js handles all search, table rendering, and assignment logic -->
  <script src="admin.js"></script>
</body>
</html>
